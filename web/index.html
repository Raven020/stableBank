<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stableBank — demo console</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="app-header">
  <h1>stableBank</h1>
  <div id="clock-display">sim clock: <b id="clock-value">—</b></div>
  <div class="spacer"></div>
  <div id="global-error"></div>
  <button id="refresh-all-btn">Refresh all</button>
</header>

<nav id="tabs">
  <button class="tab-btn" data-tab="dashboard">Dashboard</button>
  <button class="tab-btn" data-tab="ledger">Ledger</button>
  <button class="tab-btn" data-tab="account">Account &amp; Purchases</button>
  <button class="tab-btn" data-tab="loans">Loans</button>
  <button class="tab-btn" data-tab="simulation">Simulation</button>
  <button class="tab-btn" data-tab="rules">Rules Editor</button>
  <button class="tab-btn" data-tab="demo">Demo Mode</button>
</nav>

<main>
  <section id="tab-dashboard" class="tab-panel"></section>
  <section id="tab-ledger" class="tab-panel"></section>
  <section id="tab-account" class="tab-panel"></section>
  <section id="tab-loans" class="tab-panel"></section>
  <section id="tab-simulation" class="tab-panel"></section>
  <section id="tab-rules" class="tab-panel"></section>
  <section id="tab-demo" class="tab-panel"></section>
</main>

<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
